version: 2

models:
  - name: dim_crop
    description: >
      Culturas acompanhadas. Arábica e canephora detalham o café total (a partir de 2012):
      somas entre culturas devem filtrar `is_coffee_breakdown = false` para não contar o café
      duas vezes.
    columns:
      - name: crop
        description: "Chave da cultura em inglês (soybean, corn, coffee_total, coffee_arabica, coffee_canephora), a mesma das partições da ingestão."
        data_tests: [unique, not_null]
      - name: is_coffee_breakdown
        description: Verdadeiro para arábica e canephora, que detalham o café total desde 2012; excluir das somas entre culturas.
        data_tests: [not_null]
      - name: series_break_year
        description: >
          Primeiro ano de uma nova unidade de medida na fonte. Café: "em coco" até 2001 e
          "beneficiado" a partir de 2002 (nota 4 da tabela 5457), sem coeficiente oficial de
          conversão na PAM. Produção e rendimento não devem ser somados nem comparados através
          desse ano (teste assert_coffee_series_do_not_cross_unit_break).
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "= {{ var('coffee_unit_break_year') }}"
              config:
                where: "series_break_year is not null"
      - name: product_id
        description: Código do produto na classificação 782 do SIDRA (tabela 5457).
      - name: crop_name_pt
        description: Nome do produto em português, como publicado pelo IBGE.
      - name: series_break_note
        description: Explicação da quebra de série, em português, para quem consulta a dimensão.

  - name: dim_year
    description: >
      Dimensão de ano conformada, compartilhada entre o fato de produção e, na fase 8, o fato
      de clima.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: decade
        description: "Primeiro ano da década. Exemplo: 1990."
      - name: is_real_value_available
        description: >
          Verdadeiro quando o valor da produção pode ser deflacionado: ano a partir de
          `real_value_first_year` (1995) e com os 12 meses de IPCA.
        data_tests: [not_null]
      - name: coffee_production_unit
        description: >
          Unidade em que a PAM mede a produção de café no ano: `coffee_in_husk` (em coco) até
          2001 e `coffee_processed` (beneficiado) a partir de 2002 (var `coffee_unit_break_year`).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [coffee_in_husk, coffee_processed]
      - name: is_coffee_processed_unit
        description: Verdadeiro a partir de 2002; filtrar por ele em qualquer série longa de café.
        data_tests: [not_null]
      - name: decade_label
        description: "Rótulo da década. Exemplo: \"1990s\"."

  - name: dim_municipality
    description: >
      Todos os municípios da malha atual (Localidades), inclusive os 7 sem dados na PAM, que
      não têm linhas no fato.
    columns:
      - name: municipality_id
        data_tests: [unique, not_null]
      - name: state_abbreviation
        data_tests: [not_null]
      - name: first_pam_year
        description: >
          Primeiro ano com dado na PAM para as culturas acompanhadas. Aproximação para o ano de
          criação de municípios desmembrados; nulo quando não há dado.
      - name: municipality_name
        description: Nome do município, como na API de Localidades.
      - name: state_id
        description: Código IBGE da UF (2 dígitos).
      - name: state_name
        description: Nome da UF.
      - name: region_id
        description: Código da macrorregião (1 Norte, 2 Nordeste, 3 Sudeste, 4 Sul, 5 Centro-Oeste).
      - name: region_abbreviation
        description: Sigla da macrorregião (N, NE, SE, S, CO).
      - name: region_name
        description: Nome da macrorregião.
      - name: intermediate_region_id
        description: Código da região geográfica intermediária (divisão regional de 2017).
      - name: intermediate_region_name
        description: Nome da região intermediária.
      - name: immediate_region_id
        description: Código da região geográfica imediata (divisão de 2017), o nível territorial da análise de clima × rendimento.
      - name: immediate_region_name
        description: Nome da região imediata.
      - name: mesoregion_id
        description: Código da mesorregião (divisão de 1989); nulo em municípios criados depois dela.
      - name: mesoregion_name
        description: Nome da mesorregião.
      - name: microregion_id
        description: Código da microrregião (divisão de 1989); nulo em municípios criados depois dela.
      - name: microregion_name
        description: Nome da microrregião.
      - name: representative_lat
        description: >
          Latitude (graus, SIRGAS 2000) do ponto representativo do polígono do município na malha
          do IBGE, um ponto garantidamente dentro do polígono (o centroide pode cair fora). Nulo
          se o município não está no mapeamento da grade climática.
      - name: representative_lon
        description: Longitude (graus, SIRGAS 2000) do ponto representativo do polígono do município.

  - name: fct_crop_production
    description: >
      Produção agrícola por município × cultura × ano. Só existem linhas com algum dado na PAM;
      combinações ausentes significam "sem dado", nunca produção zero.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [municipality_id, crop, year]
      - dbt_utils.expression_is_true:
          arguments:
            # Production implies harvested area (nulls count as "no production"/"no area").
            expression: "coalesce(production_t, 0) <= 0 or coalesce(harvested_area_ha, 0) > 0"
      - dbt_utils.expression_is_true:
          arguments:
            # Recalculated yield agrees with IBGE's within rounding. Warns on known source
            # errors (28 records in 1998 published as "-").
            expression: "abs(round(yield_kg_ha) - ibge_yield_kg_ha) <= 1"
          config:
            severity: warn
            where: "harvested_area_ha > 0 and ibge_yield_kg_ha is not null"
      - dbt_utils.expression_is_true:
          arguments:
            # Real value exists exactly from real_value_first_year on, when there is a nominal value.
            expression: >-
              (production_value_real_thousand_brl is not null)
              = (year >= {{ var('real_value_first_year') }}
                 and production_value_nominal_thousand is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "production_value_real_thousand_brl is null or production_value_unit = 'Mil Reais'"
    columns:
      - name: municipality_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: municipality_id
      - name: crop
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crop')
                field: crop
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
      - name: planted_or_bearing_area_ha
        description: >
          Variável 8331 do IBGE, "área plantada ou destinada à colheita": área plantada nas
          culturas temporárias (soja, milho) e área em produção (destinada à colheita) nas
          permanentes (café), que não é plantada a cada ano.
      - name: yield_kg_ha
        description: Rendimento recalculado (produção × 1000 / área colhida); nulo sem área colhida.
      - name: ibge_yield_kg_ha
        description: Rendimento publicado pelo IBGE, mantido só para o teste de consistência.
      - name: production_value_nominal_thousand
        description: >
          Valor da produção em milhares da moeda do ano (ver `production_value_unit`). "Mil
          Cruzeiros" designa duas moedas diferentes: 1974–1985 e 1990–1992.
      - name: production_value_real_thousand_brl
        description: >
          Valor em milhares de reais a preços do ano-base (`deflation_base_year`), deflacionado
          pela média anual do IPCA. Nulo antes de 1995.
      - name: planted_or_bearing_area_status
        description: Status do valor da fonte (reported, absolute_zero, rounded_zero, not_available, not_applicable, confidential).
      - name: harvested_area_ha
        description: Área colhida em hectares (variável 216 do IBGE).
      - name: harvested_area_status
        description: Status do valor da fonte, como em `planted_or_bearing_area_status`.
      - name: production_t
        description: "Quantidade produzida em toneladas (variável 214). Café: em coco até 2001, beneficiado a partir de 2002."
      - name: production_status
        description: Status do valor da fonte.
      - name: production_value_unit
        description: Moeda do valor nominal, como publicada (Mil Cruzeiros, Mil Cruzados, Mil Reais etc.).
      - name: production_value_status
        description: Status do valor da fonte.

  - name: fct_crop_climate
    description: >
      Clima por município × cultura × ano da colheita, só para município-anos com produção.
      Colunas prefixadas pela janela: soja tem `critical_*` (plantio da Conab + 2 meses) e
      `season_*`; café arábica tem `flowering_*`, `filling_*` e `frost_*` (inverno anterior).
      `*_z` é a anomalia em desvios-padrão contra a normal 1991–2020 do próprio município;
      `*_has_normal` indica se a normal existe. Em `dim_year`, o ano é o da colheita.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [municipality_id, crop, harvest_year]
      - dbt_utils.expression_is_true:
          arguments:
            # Soybean has no coffee windows and vice versa.
            expression: >-
              (crop = 'soybean' and flowering_days_in_window is null and frost_days_in_window is null)
              or (crop = 'coffee_arabica' and critical_days_in_window is null and season_days_in_window is null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "critical_water_balance_z is null or critical_has_normal"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "frost_days <= frost_days_in_window and critical_hot_days <= critical_days_in_window"
          config:
            where: "frost_days is not null or critical_hot_days is not null"
    columns:
      - name: municipality_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: municipality_id
      - name: crop
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crop')
                field: crop
      - name: harvest_year
        description: Ano da colheita (ano da PAM).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
      - name: critical_water_balance_mm
        description: Chuva − ETo (mm) na janela crítica da soja.
      - name: critical_longest_dry_spell_days
        description: Maior veranico (dias seguidos com chuva < 1 mm) na janela crítica.
      - name: critical_hot_days_anomaly_days
        description: >
          Dias com Tmax ≥ 32 °C acima da normal do município (dias, não desvios-padrão): a
          anomalia absoluta, que o z-score infla onde a normal quase não varia.
      - name: critical_heat_degree_days
        description: Graus-dia acima de 30 °C na janela crítica (soma de max(Tmax − 30, 0)).
      - name: critical_precipitation_normal_mm
        description: Chuva média da normal 1991–2020 na janela crítica, para razões de somas.
      - name: frost_tmin_min_c
        description: Menor Tmin do inverno anterior à colheita (café arábica).
      - name: frost_days
        description: Dias do inverno anterior com Tmin ≤ 2 °C (café arábica).
      - name: critical_days_in_window
        description: Dias da janela crítica da soja (plantio da Conab + 2 meses) no ano da colheita.
      - name: critical_coverage
        description: Fração dos dias da janela com dado climático; abaixo de 0,9 os indicadores ficam nulos.
      - name: critical_precipitation_mm
        description: Chuva acumulada na janela crítica (mm).
      - name: critical_eto_mm
        description: Evapotranspiração de referência acumulada na janela crítica (mm).
      - name: critical_hot_days
        description: Dias com Tmax ≥ 32 °C na janela crítica.
      - name: critical_severe_hot_days
        description: Dias com Tmax ≥ 35 °C na janela crítica.
      - name: critical_water_balance_z
        description: Anomalia do balanço hídrico da janela crítica em desvios-padrão da normal 1991–2020 do município.
      - name: critical_hot_days_z
        description: Anomalia da contagem de dias quentes (z-score); inflada onde a normal quase não varia, ver `critical_hot_days_anomaly_days`.
      - name: critical_heat_degree_days_z
        description: Anomalia dos graus-dia acima de 30 °C (z-score).
      - name: critical_longest_dry_spell_z
        description: Anomalia do maior veranico (z-score).
      - name: critical_has_normal
        description: Verdadeiro quando o município tem normal 1991–2020 para a janela crítica (pelo menos 25 anos).
      - name: season_water_balance_z
        description: Anomalia do balanço hídrico no ciclo inteiro da soja (plantio ao fim da colheita); sinal secundário.
      - name: flowering_water_balance_z
        description: "Café arábica: anomalia do balanço hídrico na florada (setembro a novembro do ano anterior)."
      - name: filling_water_balance_z
        description: "Café arábica: anomalia do balanço hídrico no enchimento (dezembro do ano anterior a março), a janela principal do café."
      - name: frost_tmin_min_z
        description: "Café arábica: anomalia da menor Tmin do inverno anterior (z-score; negativo = inverno mais frio que o normal)."
      - name: frost_severe_days
        description: Dias do inverno anterior com Tmin ≤ 0 °C (café arábica).
