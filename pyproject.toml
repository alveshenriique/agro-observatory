[project]
name = "atlas-da-lavoura"
version = "0.1.0"
description = "Data pipeline on Brazilian agricultural production (IBGE PAM, BCB IPCA, BR-DWGD climate)."
authors = [
    { name = "Henrique Alves", email = "henrique.a.campos@ufv.br" }
]
requires-python = ">=3.12"
dependencies = [
    "google-cloud-bigquery>=3.47",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "netcdf4>=1.7.4",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "scipy>=1.18.1",
    "shapely>=2.1.2",
    "xarray>=2026.7.0",
]

[project.scripts]
ingest-pam = "atlas_da_lavoura.ingestion.pam:main"
ingest-localities = "atlas_da_lavoura.ingestion.localities:main"
ingest-ipca = "atlas_da_lavoura.ingestion.ipca:main"
load-raw = "atlas_da_lavoura.load_raw:main"
ingest-brdwgd = "atlas_da_lavoura.ingestion.brdwgd:main"
export-window-indicators = "atlas_da_lavoura.export_window_indicators:main"
bq-dbt = "atlas_da_lavoura.bq_dbt:main"
export-serving = "atlas_da_lavoura.serving.export:main"
package-serving = "atlas_da_lavoura.serving.package:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "colorspacious>=1.1.2",
    "daltonlens>=0.1.5",
    "dbt-bigquery~=1.12.2",
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
    "matplotlib>=3.11.2",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
