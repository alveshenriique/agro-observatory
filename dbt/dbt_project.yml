name: agro_observatory
version: "1.0.0"
profile: agro_observatory

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
test-paths: ["tests"]

vars:
  # Real values are expressed at this year's prices. Fixed on purpose: moving it silently
  # would change every real value in the marts.
  deflation_base_year: 2025
  # First year with production value in reais and stable prices (after the Plano Real).
  real_value_first_year: 1995
  # Growth decomposition pairs whose start period had less than this share of the crop's
  # national production are flagged as low base.
  low_base_share_threshold: 0.01

  # Climate x production (phase 8b). Thresholds are documented in docs/METODOLOGIA.md.
  climate_first_harvest_year: 1981  # windows with year_offset -1 need the previous year (1980)
  climate_min_window_coverage: 0.9  # share of window days with data; below it, indicators are null
  heat_tmax_threshold_c: 32
  severe_heat_tmax_threshold_c: 35
  dry_day_precipitation_mm: 1  # ETCCDI "dry day"
  frost_tmin_threshold_c: 2  # air temperature in the grid; the leaf is colder
  severe_frost_tmin_threshold_c: 0
  climate_normal_start_year: 1991  # WMO standard normal period
  climate_normal_end_year: 2020
  climate_normal_min_years: 25
  yield_trend_start_year: 1991
  yield_trend_end_year: 2025
  yield_trend_min_years: 15
  yield_trend_min_harvested_area_ha: 1000
  biennial_crops: ["coffee_arabica"]  # detrended with a centered 2x2 moving average
  planted_area_first_year: 1988  # weights fall back to harvested area before this
  stress_z_threshold: 1
  frost_area_share_threshold: 0.2
  # Audit (phase 9) corrections.
  coffee_unit_break_year: 2002  # PAM: coffee "em coco" until 2001, "beneficiado" from 2002 (table 5457, note 4)
  biennial_ols_min_years: 10  # log-linear fit with a parity term for biennial crops (arabica has 14 years)
  territory_normal_min_years: 15  # years in the normal period needed to re-standardize a territory's series
  heat_degree_day_base_c: 30  # degree-days above this Tmax, a continuous heat measure
  heat_min_extra_hot_days: 5  # heat stress needs z >= stress_z_threshold AND this many hot days above normal
  # Phase 10b: `use_derived_climate_source` (default: true on BigQuery, false elsewhere) makes the
  # window indicators come from the derived source instead of the daily climate; see
  # macros/warehouse_layout.sql. Not set here because its default depends on the target.

# Writes to a BigQuery target need the confirmation of `uv run bq-dbt` (sandbox storage quota).
on-run-start:
  - "{{ guard_bigquery_writes() }}"

flags:
  send_anonymous_usage_stats: false

models:
  agro_observatory:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    # Serving layer for the website files: views, so they use no BigQuery storage quota.
    serve:
      +materialized: view
      +schema: serve

seeds:
  agro_observatory:
    +schema: seeds
    crops:
      +column_types:
        series_break_year: integer
    conab_soybean_calendar:
      +column_types:
        planting_start_month: integer
        planting_end_month: integer
        overlap_start_month: integer
        overlap_end_month: integer
        harvest_start_month: integer
        harvest_end_month: integer
    crop_calendar_windows:
      +column_types:
        month: integer
        year_offset: integer
    known_climate_events:
      +column_types:
        harvest_year: integer
    sidra_official_aggregates:
      +column_types:
        territory_id: integer
        year: integer
        official_value: numeric
    sidra_known_discrepancies:
      +column_types:
        territory_id: integer
        year: integer
        official_value: numeric
        our_value: numeric
    conab_soybean_series:
      +column_types:
        harvest_year: integer
        planted_area_ha: numeric
        production_t: numeric
        yield_kg_ha: numeric
