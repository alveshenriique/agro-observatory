version: 2

models:
  - name: dim_crop
    description: >
      Culturas acompanhadas. Arábica e canephora detalham o café total (a partir de 2012):
      somas entre culturas devem filtrar `is_coffee_breakdown = false` para não contar o café
      duas vezes.
    columns:
      - name: crop
        data_tests: [unique, not_null]
      - name: is_coffee_breakdown
        data_tests: [not_null]

  - name: dim_year
    description: >
      Dimensão de ano conformada, compartilhada entre o fato de produção e, na fase 8, o fato
      de clima.
    columns:
      - name: year
        data_tests: [unique, not_null]
      - name: decade
        description: "Primeiro ano da década. Exemplo: 1990."
      - name: is_real_value_available
        description: >
          Verdadeiro quando o valor da produção pode ser deflacionado: ano a partir de
          `real_value_first_year` (1995) e com os 12 meses de IPCA.
        data_tests: [not_null]

  - name: dim_municipality
    description: >
      Todos os municípios da malha atual (Localidades), inclusive os 7 sem dados na PAM, que
      não têm linhas no fato.
    columns:
      - name: municipality_id
        data_tests: [unique, not_null]
      - name: state_abbreviation
        data_tests: [not_null]
      - name: first_pam_year
        description: >
          Primeiro ano com dado na PAM para as culturas acompanhadas. Aproximação para o ano de
          criação de municípios desmembrados; nulo quando não há dado.

  - name: fct_crop_production
    description: >
      Produção agrícola por município × cultura × ano. Só existem linhas com algum dado na PAM;
      combinações ausentes significam "sem dado", nunca produção zero.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [municipality_id, crop, year]
      - dbt_utils.expression_is_true:
          arguments:
            # Production implies harvested area (nulls count as "no production"/"no area").
            expression: "coalesce(production_t, 0) <= 0 or coalesce(harvested_area_ha, 0) > 0"
      - dbt_utils.expression_is_true:
          arguments:
            # Recalculated yield agrees with IBGE's within rounding. Warns on known source
            # errors (28 records in 1998 published as "-").
            expression: "abs(round(yield_kg_ha) - ibge_yield_kg_ha) <= 1"
          config:
            severity: warn
            where: "harvested_area_ha > 0 and ibge_yield_kg_ha is not null"
      - dbt_utils.expression_is_true:
          arguments:
            # Real value exists exactly from real_value_first_year on, when there is a nominal value.
            expression: >-
              (production_value_real_thousand_brl is not null)
              = (year >= {{ var('real_value_first_year') }}
                 and production_value_nominal_thousand is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "production_value_real_thousand_brl is null or production_value_unit = 'Mil Reais'"
    columns:
      - name: municipality_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: municipality_id
      - name: crop
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crop')
                field: crop
      - name: year
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
      - name: yield_kg_ha
        description: Rendimento recalculado (produção × 1000 / área colhida); nulo sem área colhida.
      - name: ibge_yield_kg_ha
        description: Rendimento publicado pelo IBGE, mantido só para o teste de consistência.
      - name: production_value_nominal_thousand
        description: >
          Valor da produção em milhares da moeda do ano (ver `production_value_unit`). "Mil
          Cruzeiros" designa duas moedas diferentes: 1974–1985 e 1990–1992.
      - name: production_value_real_thousand_brl
        description: >
          Valor em milhares de reais a preços do ano-base (`deflation_base_year`), deflacionado
          pela média anual do IPCA. Nulo antes de 1995.

  - name: fct_crop_climate
    description: >
      Clima por município × cultura × ano da colheita, só para município-anos com produção.
      Colunas prefixadas pela janela: soja tem `critical_*` (plantio da Conab + 2 meses) e
      `season_*`; café arábica tem `flowering_*`, `filling_*` e `frost_*` (inverno anterior).
      `*_z` é a anomalia em desvios-padrão contra a normal 1991–2020 do próprio município;
      `*_has_normal` indica se a normal existe. Em `dim_year`, o ano é o da colheita.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [municipality_id, crop, harvest_year]
      - dbt_utils.expression_is_true:
          arguments:
            # Soybean has no coffee windows and vice versa.
            expression: >-
              (crop = 'soybean' and flowering_days_in_window is null and frost_days_in_window is null)
              or (crop = 'coffee_arabica' and critical_days_in_window is null and season_days_in_window is null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: "critical_water_balance_z is null or critical_has_normal"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "frost_days <= frost_days_in_window and critical_hot_days <= critical_days_in_window"
          config:
            where: "frost_days is not null or critical_hot_days is not null"
    columns:
      - name: municipality_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_municipality')
                field: municipality_id
      - name: crop
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_crop')
                field: crop
      - name: harvest_year
        description: Ano da colheita (ano da PAM).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_year')
                field: year
      - name: critical_water_balance_mm
        description: Chuva − ETo (mm) na janela crítica da soja.
      - name: critical_longest_dry_spell_days
        description: Maior veranico (dias seguidos com chuva < 1 mm) na janela crítica.
      - name: frost_tmin_min_c
        description: Menor Tmin do inverno anterior à colheita (café arábica).
      - name: frost_days
        description: Dias do inverno anterior com Tmin ≤ 2 °C (café arábica).
