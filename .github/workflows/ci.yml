name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job has a timeout-minutes ceiling (GitHub's default is 360 minutes), kept at about
# three times its slowest recent run with a 5-minute floor, and the network-bound steps
# have tighter limits of their own, so a stall fails within minutes.
env:
  # setup-uv restores its cache with @actions/cache, which waits up to 10 minutes on a
  # stalled segment by default; give up sooner and carry on as a cache miss.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        timeout-minutes: 3
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  data:
    name: Load sample and dbt build
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: atlas_da_lavoura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d atlas_da_lavoura_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists during this job: not secrets.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: atlas_da_lavoura_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        timeout-minutes: 3
        run: uv sync --locked

      - name: Load raw sample into Postgres
        run: uv run load-raw --data-dir tests/fixtures/raw

      - name: dbt deps
        timeout-minutes: 3
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build

      # Serving layer: export the website files from the sample with the production code,
      # validate them against the JSON Schemas and the validity rules, and reconcile them with
      # the marts. The sample bundle (7 municipalities, partial mesh) is never published.
      - name: Export the website data files (sample)
        run: >-
          uv run export-serving --target postgres --sample
          --mesh tests/fixtures/raw/ibge_mesh/municipalities.geojson --out ci-site-data

      # The BigQuery production target has no daily climate: it reads the window indicators
      # computed here from a derived source. Test that path on Postgres with the same models
      # and tests: export the indicators, load them as the derived source, rebuild in that mode.
      - name: Export the window indicators (derived source)
        run: uv run export-window-indicators --out derived/climate/window_indicators.parquet

      - name: Load the derived source into Postgres
        run: uv run load-raw --data-dir derived --sources climate_window_indicators

      - name: dbt build with the derived climate source (BigQuery layout)
        working-directory: dbt
        run: |
          uv run dbt build --vars '{use_derived_climate_source: true}'
