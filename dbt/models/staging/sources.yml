version: 2

sources:
  - name: raw
    description: >
      Camada raw carregada pelo `load-raw` a partir dos Parquet em data/raw. As colunas da fonte
      estão em texto, com os nomes exatos das APIs (case-sensitive, alguns com hífen; no BigQuery,
      que não aceita hífen, o hífen vira `_`), mais os metadados `_ingested_at` e `_loaded_at`,
      que o staging lê. Os demais metadados dependem do banco: no Postgres, cada linha também
      guarda `_source_url` e `_source_file`, que a carga usa para substituir um arquivo de cada
      vez; no BigQuery, onde cada tabela é substituída inteira, a URL de origem fica uma vez por
      arquivo em `raw._load_manifest`.
    schema: raw
    tables:
      - name: pam
        description: >
          IBGE, Produção Agrícola Municipal (SIDRA, tabela 5457), um registro por município ×
          produto × ano × variável. `V` traz o valor como texto, incluindo os símbolos especiais
          do IBGE ("-", "0", "...", "..", "X").
        columns:
          - name: D1C
            description: Código IBGE do município (7 dígitos).
          - name: D2C
            description: Código da variável (8331, 216, 214, 112, 215).
          - name: D3C
            description: Ano.
          - name: D4C
            description: Código do produto na classificação 782.
          - name: V
            description: Valor como retornado pela API, em texto.
          - name: MN
            description: Unidade de medida da variável.

      - name: localities
        description: >
          IBGE, API de Localidades: snapshot da malha municipal atual, com a hierarquia achatada
          em colunas nomeadas pelo caminho da API (ex.: `microrregiao__mesorregiao__UF__sigla`).
        columns:
          - name: id
            description: Código IBGE do município (7 dígitos).

      - name: ipca
        description: Banco Central, SGS série 433, IPCA com variação mensal (% ao mês).
        columns:
          - name: data
            description: Mês de referência no formato dd/mm/aaaa, sempre no dia 01.
          - name: valor
            description: Variação mensal em %, com ponto decimal.

      - name: brdwgd_municipality_cells
        description: >
          Como cada município foi associado à grade do BR-DWGD: método (`cells_inside`,
          `representative_point`, `nearest_valid_cell`, `no_data`), número de células, centroide
          e ponto representativo do polígono da malha do IBGE.
        columns:
          - name: municipality_id
            description: Código IBGE do município.
          - name: method
            description: Método de associação município → células.

      - name: brdwgd_municipality_daily
        config:
          enabled: "{{ not var('use_derived_climate_source', target.type == 'bigquery') }}"
        description: >
          Clima diário por município (BR-DWGD v3.2.4, grade de 0,1° agregada pela ingestão):
          chuva, ETo, Tmax e Tmin. Exceção à raw em texto: colunas tipadas, por ser um produto
          derivado. Tabela particionada por ano no Postgres; os metadados de carga ficam em
          `raw._load_manifest`.
        columns:
          - name: municipality_id
            description: Código IBGE do município.
          - name: date
            description: Dia.
          - name: precipitation_mm
            description: Chuva em mm.
          - name: tmax_c
            description: Temperatura máxima do ar em °C.
          - name: tmin_c
            description: Temperatura mínima do ar em °C.
          - name: eto_mm
            description: Evapotranspiração de referência em mm.

      - name: climate_window_indicators
        config:
          enabled: "{{ var('use_derived_climate_source', target.type == 'bigquery') }}"
        description: >
          Fonte derivada: o resultado de `int_climate__window_indicators` calculado no Postgres
          local a partir do clima diário, exportado por `export-window-indicators` e carregado
          pelo `load-raw`. Existe só nos warehouses que não recebem o clima diário (o BigQuery de
          produção), onde o modelo passa a ser uma view sobre ela; tipos e colunas iguais aos do
          modelo.
