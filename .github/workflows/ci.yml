name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest

  data:
    name: Load sample and dbt build
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agro_observatory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agro_observatory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists during this job: not secrets.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: agro_observatory_ci
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Load raw sample into Postgres
        run: uv run load-raw --data-dir tests/fixtures/raw

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build
