[project]
name = "agro-observatory"
version = "0.1.0"
description = "Data pipeline on Brazilian agricultural production (IBGE PAM, BCB IPCA, INMET)."
authors = [
    { name = "Henrique Alves", email = "henrique.a.campos@ufv.br" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ingest-pam = "agro_observatory.ingestion.pam:main"
ingest-localities = "agro_observatory.ingestion.localities:main"
ingest-ipca = "agro_observatory.ingestion.ipca:main"
load-raw = "agro_observatory.load_raw:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "dbt-core>=1.12.5",
    "dbt-postgres>=1.11.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
