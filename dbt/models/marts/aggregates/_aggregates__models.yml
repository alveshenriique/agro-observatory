version: 2

models:
  - name: agg_production_growth_decomposition
    description: >
      Decomposição logarítmica do crescimento da produção em efeito área e efeito rendimento:
      ln(P1/P0) = ln(A1/A0) + ln(Y1/Y0), com Y = P / A (área colhida). Cada período é a média de
      3 anos em torno de um ano-âncora (1975, 1985, 1995, 2005, 2015 e 2024). Compara períodos
      consecutivos e o intervalo completo, para Brasil e macrorregiões. Café pelo total (o
      detalhamento só existe a partir de 2012) e só com âncoras de 2005 em diante, porque a PAM
      mudou a unidade do café em 2002 (`dim_crop.series_break_year`): o intervalo completo do
      café é 2005 → 2024, o da soja e do milho é 1975 → 2024.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [crop, territory_id, start_anchor, end_anchor]
      - dbt_utils.expression_is_true:
          arguments:
            # The decomposition must close exactly (up to floating-point error).
            expression: "abs(ln_production_growth - (ln_area_effect + ln_yield_effect)) < 1e-9"
          config:
            where: "ln_production_growth is not null"
    columns:
      - name: territory_level
        data_tests:
          - accepted_values:
              arguments:
                values: [country, macro_region]
      - name: start_share_of_national_production
        description: Participação do território na produção nacional da cultura no período inicial.
      - name: is_low_base
        description: >
          Verdadeiro quando o período inicial tinha menos de 1% da produção nacional da cultura
          (var `low_base_share_threshold`). O crescimento em log é correto, mas enorme, porque a
          cultura praticamente começou do zero; filtrar no Power BI para comparar regiões.
        data_tests: [not_null]
      - name: ln_area_effect
        description: Parte do crescimento (em log) explicada pela variação da área colhida.
      - name: ln_yield_effect
        description: Parte do crescimento (em log) explicada pela variação do rendimento.
      - name: area_share_of_growth
        description: >
          Fração do crescimento explicada pela área. Pode sair de [0, 1] quando um dos efeitos é
          negativo (ex.: área cai e rendimento sobe).
      - name: territory_id
        description: "Código do território: 0 para o Brasil, código da macrorregião (1 a 5) para as regiões."
      - name: start_anchor
        description: Ano-âncora do período inicial; o período é a média de 3 anos em torno dele.
      - name: end_anchor
        description: Ano-âncora do período final.
      - name: start_period
        description: "Rótulo do período inicial. Exemplo: \"1974–1976\"."
      - name: ln_production_growth
        description: ln(produção final ÷ produção inicial); exp() dá o fator de crescimento.
      - name: yield_share_of_growth
        description: Fração do crescimento explicada pelo rendimento (1 − `area_share_of_growth`).

  - name: agg_production_share_by_territory
    description: >
      Participação de cada UF e de cada região intermediária na produção nacional, por cultura
      e ano, numa grade completa (território sem produção no ano aparece com 0).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [crop, year, territory_level, territory_id]
    columns:
      - name: territory_level
        data_tests:
          - accepted_values:
              arguments:
                values: [state, intermediate_region]
      - name: share_of_national_production
        description: Participação na produção nacional (0 a 1).
      - name: territory_id
        description: Código IBGE da UF ou da região intermediária.
      - name: production_t
        description: Produção do território no ano (0 quando não produziu ou não há dado).
      - name: national_production_t
        description: Produção nacional da cultura no ano, denominador da participação.

  - name: agg_territory_share_thresholds
    description: >
      Ano em que cada território atingiu 1% e 5% da produção nacional, por cultura.
      `first_year_reached` é o primeiro ano acima do limiar (pode ser um pico isolado);
      `first_year_sustained` é o ano a partir do qual a participação nunca mais caiu abaixo dele.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [crop, territory_level, territory_id, threshold]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "first_year_sustained is null or first_year_sustained >= first_year_reached"
    columns:
      - name: threshold
        description: Limiar de participação na produção nacional (0,01 ou 0,05).
      - name: first_year_reached
        description: Primeiro ano em que a participação ficou acima do limiar; pode ser um pico isolado.
      - name: first_year_sustained
        description: Ano a partir do qual a participação nunca mais caiu abaixo do limiar; nulo se ainda não aconteceu.
      - name: max_share
        description: Maior participação do território na série.

  - name: agg_production_concentration
    description: >
      Concentração da produção entre municípios, por cultura e ano: quantos municípios somam
      50% e 80% da produção nacional e o índice Herfindahl-Hirschman (HHI, escala 0–10.000).
      A contagem de municípios é afetada por desmembramentos; o HHI é mais robusto a eles.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [crop, year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: >-
              municipalities_for_50pct <= municipalities_for_80pct
              and municipalities_for_80pct <= producing_municipalities
              and hhi > 0 and hhi <= 10000
    columns:
      - name: hhi
        description: >
          Soma dos quadrados das participações em %. 10.000 = um só município produz tudo;
          valores baixos = produção espalhada.
      - name: producing_municipalities
        description: Municípios com produção positiva no ano.
      - name: municipalities_for_50pct
        description: Quantos municípios, do maior para o menor, somam 50% da produção nacional.
      - name: municipalities_for_80pct
        description: Quantos municípios somam 80% da produção nacional.
      - name: share_of_producers_for_50pct
        description: "`municipalities_for_50pct` ÷ `producing_municipalities`."

  - name: agg_coffee_mg_biennial
    description: >
      Café em Minas Gerais, para identificar a bienalidade do arábica, em produção e em
      rendimento (produção ÷ área colhida). Três séries, nunca misturadas: `coffee_total_in_husk`
      (1974–2001, café em coco), `coffee_total_processed` (2002 em diante, beneficiado) e
      `coffee_arabica` (2012 em diante). A PAM mudou a unidade em 2002 sem coeficiente de
      conversão, então nenhuma razão nem variação atravessa esse ano: as médias móveis são
      calculadas dentro de cada série e ficam nulas nas pontas. A tendência é a média móvel
      centrada 2x2 (pesos 1/4, 1/2, 1/4), que elimina exatamente um ciclo de 2 anos;
      `production_ratio_to_trend` e `yield_ratio_to_trend` > 1 indicam ano de alta, < 1 ano de
      baixa. Limitação: a média 2×2 absorve choques de dois anos seguidos (2014–2015, 2021–2022);
      a alternativa com reta e termo de bienalidade está em `agg_climate_yield_association`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [series, year]
      - dbt_utils.expression_is_true:
          arguments:
            # The unit label of the year must match the series.
            expression: "(series = 'coffee_total_in_husk') = (production_unit = 'coffee_in_husk')"
    columns:
      - name: series
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [coffee_total_in_husk, coffee_total_processed, coffee_arabica]
      - name: production_ratio_to_trend
        description: Produção ÷ média móvel 2×2 da produção; nula nas pontas de cada série.
      - name: yield_ratio_to_trend
        description: Rendimento ÷ média móvel 2×2 do rendimento; nula nas pontas de cada série.
      - name: cycle_phase
        description: Fase do ciclo pela produção (`on_year` acima da tendência, `off_year` abaixo).
        data_tests:
          - accepted_values:
              arguments:
                values: [on_year, off_year]
      - name: yield_cycle_phase
        description: Fase do ciclo pelo rendimento.
        data_tests:
          - accepted_values:
              arguments:
                values: [on_year, off_year]
      - name: production_unit
        description: "Unidade da produção no ano: `coffee_in_husk` (em coco) até 2001, `coffee_processed` (beneficiado) a partir de 2002."
      - name: production_t
        description: Produção de café em MG na série (toneladas, na unidade de `production_unit`).
      - name: yield_kg_ha
        description: Produção ÷ área colhida (kg/ha).
      - name: production_change_vs_previous_year
        description: Variação da produção contra o ano anterior (fração); nula no primeiro ano de cada série.
      - name: production_centered_trend_t
        description: Média móvel centrada 2×2 da produção (pesos 1/4, 1/2, 1/4), que elimina o ciclo de 2 anos.
      - name: yield_centered_trend_kg_ha
        description: Média móvel centrada 2×2 do rendimento.

  - name: agg_climate_yield_association
    description: >
      Anomalias climáticas e anomalia de rendimento por território (região imediata e UF) ×
      cultura × ano da colheita. Os z-scores municipais são agregados pela média ponderada pela
      área plantada (no café, a área em produção; área colhida antes de 1988, ver `weight_basis`)
      e a série de cada território é padronizada de novo pela sua própria normal 1991–2020
      (`*_z`; a média simples dos z municipais fica em `*_z_municipal_mean`), porque a média de
      z-scores encolhe a dispersão; sem 15 anos no período (café arábica, desde 2012), `*_z`
      fica na média simples e `is_territory_standardized` é falso. Chuva relativa à normal é razão de somas ponderadas. Janela
      principal: `critical` na soja, `filling` no café. Classes de estresse com z = ±1; calor
      exige também ≥ 5 dias quentes acima da normal; geada quando ≥ 20% da área está em
      municípios com algum dia ≤ 2 °C. No café, as duas anomalias de rendimento (média 2×2 em
      `yield_anomaly_pct`, reta com termo de bienalidade em `biennial_ols_yield_anomaly_pct`)
      ficam lado a lado. Associação, não causalidade.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [territory_level, territory_id, crop, harvest_year]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(is_water_deficit is null) = (not is_normal_available)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(yield_anomaly_pct is null) = (not is_trend_available)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "weight_basis = case when harvest_year >= {{ var('planted_area_first_year') }} then 'planted_or_bearing_area' else 'harvested_area' end"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_heat_stress = (hot_days_z >= {{ var('stress_z_threshold') }} and hot_days_anomaly_days >= {{ var('heat_min_extra_hot_days') }})"
          config:
            where: "is_normal_available and hot_days_z is not null and hot_days_anomaly_days is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_territory_standardized = (territory_normal_years >= {{ var('territory_normal_min_years') }})"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "is_water_deficit = (water_balance_z <= -{{ var('stress_z_threshold') }})"
          config:
            where: "is_normal_available and water_balance_z is not null"
    columns:
      - name: territory_level
        data_tests:
          - accepted_values:
              arguments:
                values: [immediate_region, state]
      - name: weight_basis
        description: "Peso usado na agregação: área plantada (café: área em produção) ou, antes de 1988, área colhida."
        data_tests:
          - accepted_values:
              arguments:
                values: [planted_or_bearing_area, harvested_area]
      - name: water_balance_z
        description: >
          Balanço hídrico da janela principal: média ponderada dos z municipais, padronizada de
          novo pela normal 1991–2020 do próprio território (média e desvio-padrão da série).
      - name: water_balance_z_municipal_mean
        description: A média ponderada dos z municipais antes da nova padronização.
      - name: is_territory_standardized
        description: >
          Verdadeiro quando o território tem pelo menos `territory_normal_min_years` (15) anos
          em 1991–2020 e os `*_z` foram padronizados de novo; falso (café arábica, que só existe
          desde 2012, e regiões recentes) quando `*_z` é a média simples dos z municipais.
        data_tests: [not_null]
      - name: precipitation_pct_of_normal
        description: Chuva ÷ chuva normal, em %, como razão de somas ponderadas pela área.
      - name: hot_days_anomaly_days
        description: Dias quentes acima da normal, média ponderada (dias).
      - name: heat_degree_days_z
        description: Graus-dia acima de 30 °C na janela principal, padronizados como `water_balance_z`.
      - name: is_heat_stress
        description: z dos dias quentes ≥ 1 e pelo menos `heat_min_extra_hot_days` (5) dias acima da normal.
      - name: biennial_ols_yield_anomaly_pct
        description: >
          Café: anomalia de rendimento pela reta log-linear com termo de bienalidade (paridade
          do ano). Mantém choques de dois anos seguidos que a média 2×2 absorve, mas erra quando
          a alternância vira; nula na soja.
      - name: season_water_balance_z
        description: Idem para o ciclo inteiro da soja (plantio ao fim da colheita); nulo no café.
      - name: is_season_water_deficit
        description: Déficit hídrico no ciclo inteiro da soja (z ≤ −1); sinal secundário.
      - name: frost_area_share
        description: Participação da área em municípios com ≥ 1 dia de geada no inverno anterior (café).
      - name: yield_anomaly_pct
        description: Rendimento ÷ tendência − 1 (fração).
      - name: territory_id
        description: Código IBGE da região imediata ou da UF.
      - name: harvest_year
        description: Ano da colheita (ano da PAM).
      - name: primary_window
        description: "Janela usada nos `*_z` sem prefixo: `critical` na soja, `filling` no café arábica."
      - name: municipalities
        description: Municípios produtores do território com clima no ano.
      - name: total_weight
        description: Soma dos pesos (área, em hectares) dos municípios agregados.
      - name: is_normal_available
        description: Verdadeiro quando pelo menos metade da área está em municípios com normal 1991–2020; só então há classes de estresse.
      - name: hot_days_z
        description: Anomalia dos dias com Tmax ≥ 32 °C na janela principal, padronizada como `water_balance_z`.
      - name: longest_dry_spell_z
        description: Anomalia do maior veranico na janela principal.
      - name: flowering_water_balance_z
        description: "Café: anomalia do balanço hídrico na florada."
      - name: frost_tmin_min_z
        description: "Café: anomalia da menor Tmin do inverno anterior."
      - name: frost_tmin_min_c
        description: "Café: menor Tmin do inverno anterior, média ponderada pela área (°C)."
      - name: is_water_deficit
        description: "Déficit hídrico na janela principal: `water_balance_z` ≤ −1."
      - name: is_frost
        description: "Café: geada quando ≥ 20% da área está em municípios com algum dia de Tmin ≤ 2 °C no inverno anterior."
      - name: yield_kg_ha
        description: Rendimento do território no ano (soma da produção ÷ soma da área colhida).
      - name: trend_yield_kg_ha
        description: Rendimento previsto pela tendência tecnológica do território.
      - name: trend_method
        description: "Método da tendência: `log_linear_ols` (soja) ou `centered_2x2_moving_average` (café)."
      - name: is_trend_available
        description: "Verdadeiro quando o território tem tendência (soja: ≥ 15 anos com área ≥ 1.000 ha em 1991–2025)."
      - name: is_biennial_ols_available
        description: "Café: verdadeiro quando a reta com termo de bienalidade pôde ser ajustada (≥ 10 anos)."

  - name: agg_climate_yield_association_summary
    description: >
      Resumo da associação por território × cultura, nos anos com normal e tendência:
      correlações entre as anomalias climáticas e a de rendimento, anomalia média em anos de
      estresse vs demais e taxa de acerto (anos de estresse com anomalia negativa), comparável
      com `negative_anomaly_share_all_years`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [territory_level, territory_id, crop]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "water_deficit_hit_rate between 0 and 1"
          config:
            where: "water_deficit_hit_rate is not null"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "corr_water_balance_yield between -1 and 1"
          config:
            where: "corr_water_balance_yield is not null"
    columns:
      - name: n_years
        description: Anos do território com normal e tendência, base de todas as métricas.
      - name: corr_water_balance_yield
        description: Correlação de Pearson entre `water_balance_z` e `yield_anomaly_pct` (−1 a 1).
      - name: corr_hot_days_yield
        description: Correlação entre a anomalia de dias quentes e a de rendimento.
      - name: corr_dry_spell_yield
        description: Correlação entre a anomalia do maior veranico e a de rendimento.
      - name: corr_heat_degree_days_yield
        description: Correlação entre a anomalia dos graus-dia acima de 30 °C e a de rendimento.
      - name: corr_water_balance_biennial_ols_yield
        description: "Café: correlação entre o balanço hídrico e a anomalia pela reta com termo de bienalidade."
      - name: negative_anomaly_share_all_years
        description: Fração de anos com anomalia de rendimento negativa; base de comparação das taxas de acerto.
      - name: water_deficit_years
        description: Anos classificados como déficit hídrico.
      - name: mean_anomaly_water_deficit_years
        description: Anomalia média de rendimento nos anos de déficit (fração).
      - name: mean_anomaly_no_water_deficit_years
        description: Anomalia média de rendimento nos demais anos.
      - name: water_deficit_hit_rate
        description: Fração dos anos de déficit com anomalia negativa; comparar com `negative_anomaly_share_all_years`.
      - name: heat_stress_years
        description: Anos classificados como calor.
      - name: heat_stress_hit_rate
        description: Fração dos anos de calor com anomalia negativa.
      - name: frost_years
        description: "Café: anos classificados como geada."
      - name: frost_hit_rate
        description: "Café: fração dos anos de geada com anomalia negativa."
