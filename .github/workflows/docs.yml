name: dbt docs

# Builds the dbt documentation site on every push to main and publishes it to GitHub Pages.
# The catalog needs a database, so the job loads the CI sample into a throwaway Postgres and
# runs the full dbt build before generating the site, exactly like the CI data job.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the dbt docs site
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: agro_observatory_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d agro_observatory_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway database that only exists during this job: not secrets.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci
      POSTGRES_DB: agro_observatory_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Load raw sample into Postgres
        run: uv run load-raw --data-dir tests/fixtures/raw

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt build
        working-directory: dbt
        run: uv run dbt build

      - name: dbt docs generate
        working-directory: dbt
        # --static bundles manifest and catalog into a single HTML file, which GitHub Pages
        # serves without any extra request.
        run: |
          uv run dbt docs generate --static
          mkdir -p site
          cp target/static_index.html site/index.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dbt/site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
