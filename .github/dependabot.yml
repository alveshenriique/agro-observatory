version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows up to date: Dependabot opens a PR that
  # bumps the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Keeps the site's npm packages up to date (web/package.json and lockfile).
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
